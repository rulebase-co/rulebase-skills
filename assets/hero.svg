<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Rulebase CX Ops Skills: quality, compliance and revenue skills for your AI agent">
  <title>Rulebase CX Ops Skills</title>
  <defs>
    <clipPath id="term"><rect x="100" y="440" width="1400" height="360" rx="12"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#1a1716"/>
  <text font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" x="100" y="116" fill="#f7f7f4" fill-opacity="0.5" font-size="11" letter-spacing="1">RULEBASE CX OPS SKILLS</text>
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="100" y="206" fill="#f7f7f4" font-size="60" font-weight="400" letter-spacing="-1.2">Quality, compliance and revenue</text>
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="100" y="270" fill="#f7f7f4" font-size="60" font-weight="400" letter-spacing="-1.2">skills for your AI agent</text>
  <text font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" x="100" y="318" fill="#f7f7f4" fill-opacity="0.55" font-size="14" letter-spacing="-0.09">150+ skills  ·  CX operations  ·  Quality assurance  ·  Compliance  ·  RevOps  ·  Data and integration</text>
  <rect x="100" y="352" width="404" height="52" rx="26" fill="none" stroke="#f7f7f4" stroke-opacity="0.22"/>
  <text font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" x="128" y="384" fill="#f7f7f4" fill-opacity="0.45" font-size="14">$</text>
  <text font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" x="150" y="384" fill="#f7f7f4" font-size="14">npx skills add rulebase-co/skills</text>
  <g clip-path="url(#term)">
    <rect x="100" y="440" width="1400" height="360" fill="#221f1e"/>
    <rect x="100" y="440" width="1400" height="34" fill="#2b2827"/>
    <circle cx="124" cy="457" r="5.5" fill="#ff5f57"/>
    <circle cx="144" cy="457" r="5.5" fill="#febc2e"/>
    <circle cx="164" cy="457" r="5.5" fill="#28c840"/>
    <text font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" x="800" y="462" text-anchor="middle" fill="#f7f7f4" fill-opacity="0.4" font-size="12">claude &#183; cx-ops</text>
    <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="128" y="502" fill="#f7f7f4" fill-opacity="0.4">&gt;</text>
      <text x="150" y="502" fill="#f7f7f4">our QA score fell 2.5 points last month. why?</text>
      <text x="128" y="542" fill="#f7f7f4" fill-opacity="0.8">Checking whether the movement is real before explaining it.</text>
      <circle cx="132" cy="577" r="4" fill="#d85210"/>
      <text x="150" y="582" fill="#f7f7f4">cx-metric-movement-decomposition</text>
      <text x="150" y="606" fill="#f7f7f4" fill-opacity="0.6">&#9492; noise check: the fall clears its 95% interval, so it is real</text>
      <text x="174" y="642" fill="#f7f7f4" fill-opacity="0.55">rate effect</text>
      <text x="330" y="642" fill="#f7f7f4">+0.50</text>
      <text x="440" y="642" fill="#f7f7f4" fill-opacity="0.6">every channel improved</text>
      <text x="174" y="666" fill="#f7f7f4" fill-opacity="0.55">mix  effect</text>
      <text x="330" y="666" fill="#e8707a">-3.04</text>
      <text x="440" y="666" fill="#f7f7f4" fill-opacity="0.6">voice went from 8% to 24% of volume</text>
      <text x="174" y="690" fill="#f7f7f4" fill-opacity="0.55">net</text>
      <text x="330" y="690" fill="#f7f7f4">-2.54</text>
      <text x="128" y="726" fill="#f7f7f4" fill-opacity="0.9">Every channel got better and the total still fell. That is a routing</text>
      <text x="128" y="750" fill="#f7f7f4" fill-opacity="0.9">decision, not a quality problem: coaching the voice team will not move it.</text>
      <text x="128" y="786" fill="#f7f7f4" fill-opacity="0.4">&gt;</text>
      <rect x="150" y="774" width="9" height="16" fill="#d85210" opacity="0.9"/>
    </g>
  </g>
  <rect x="100" y="440" width="1400" height="360" rx="12" fill="none" stroke="#f7f7f4" stroke-opacity="0.1"/>
</svg>
