name: release

# Publishes the CLI to npm when a version tag is pushed.
#
#   npm version patch          # bumps package.json and creates the tag
#   git push --follow-tags
#
# Requires an NPM_TOKEN repository secret (npm → Access Tokens → Automation).
# `id-token: write` lets npm attach a provenance attestation, which links the
# published tarball to this workflow run and this commit.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # The catalog has to be valid and the index current before anything ships:
      # the published CLI reads skills-index.json from the repo, so a stale index
      # is a broken release even though the tarball itself is fine.
      - name: Validate catalog
        run: node scripts/validate-skills.mjs --strict

      - name: Check the skills index is current
        run: node scripts/build-index.mjs --check

      - name: Test
        run: node --test "tests/*.test.mjs"

      # Guards against the classic mistake: tagging v0.2.0 while package.json
      # still says 0.1.0, which publishes the wrong version.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Pack
        run: |
          npm pack --dry-run
          echo "---"
          # The bin must be in the tarball or `npx rulebase-skills` resolves to nothing.
          npm pack --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0];
            const files = p.files.map((f) => f.path);
            if (!files.includes('bin/rulebase-skills.js')) {
              console.error('::error::bin/rulebase-skills.js is not in the tarball');
              process.exit(1);
            }
            console.error('tarball contains ' + files.length + ' file(s), bin present');
          "

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
