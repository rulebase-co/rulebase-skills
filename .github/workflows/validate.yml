name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No install step: the validator is dependency-free by design.
      - name: Validate skill catalog
        run: node scripts/validate-skills.mjs --strict

      # The published CLI reads skills-index.json from this repo, so a stale
      # index ships a catalog that does not match the skills.
      - name: Check the skills index is current
        run: node scripts/build-index.mjs --check

      - name: Syntax-check the CLIs
        run: |
          set -euo pipefail
          node --check bin/rulebase-skills.js
          for f in cli/bin/*.js cli/lib/**/*.js cli/lib/*.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done
          # lib/ holds every command, so omitting it from `files` would publish a
          # bin that crashes on import.
          cd cli && npm pack --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0];
            const files = p.files.map((f) => f.path);
            for (const required of ['bin/rulebase.js', 'lib/config.js', 'lib/commands/doctor.js', 'README.md']) {
              if (!files.includes(required)) {
                console.error('::error::' + required + ' missing from the rulebase tarball');
                process.exit(1);
              }
            }
            console.error('rulebase tarball ok: ' + files.length + ' files');
          "

      - name: Syntax-check skill scripts
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in skills/**/scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done
          for f in skills/**/scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Test skill scripts
        run: node --test "tests/*.test.mjs"

      - name: Check for committed secrets
        run: |
          set -euo pipefail
          # Zendesk/Intercom/Freshdesk tokens and generic bearer secrets should
          # never appear in the catalog. Placeholders in docs use <angle brackets>.
          if grep -rInE '(dG9rZW4|Bearer [A-Za-z0-9_-]{20,}|xoxb-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{20,})' \
              --include='*.md' --include='*.mjs' --include='*.sh' --include='*.json' skills/ scripts/; then
            echo "::error::possible committed credential above"
            exit 1
          fi
